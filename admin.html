<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>BENTO | Admin</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; padding: 30px; }
        .box { background: #111; padding: 20px; border: 1px solid #222; border-radius: 8px; max-width: 500px; margin-bottom: 40px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; }
        button { width: 100%; padding: 10px; background: #ff6600; border: none; font-weight: bold; cursor: pointer; }
        .item { display: flex; justify-content: space-between; background: #111; padding: 15px; margin-top: 10px; border-radius: 5px; border-left: 4px solid #ff6600; }
        .btn-del { background: #cc0000; color: white; padding: 5px 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Cargar Producto</h2>
        <input type="text" id="nombre" placeholder="Nombre">
        <textarea id="descripcion" placeholder="Descripción"></textarea>
        <select id="categoria">
            <option value="camaras">Cámaras</option>
            <option value="alarmas">Alarmas</option>
            <option value="grabacion">DVR/NVR</option>
            <option value="Accesorios">Accesorios</option>
            <option value="controlesdeacceso">Acceso</option>
        </select>
        <input type="text" id="etiqueta" placeholder="Etiqueta (Ej: Full HD)">
        <input type="text" id="imagen" placeholder="Archivo imagen (ej: camara.jpg)">
        <input type="password" id="password" placeholder="Contraseña Maestra">
        <button onclick="subir()">PUBLICAR</button>
    </div>

    <h2>Productos en la Web</h2>
    <div id="lista">Cargando...</div>

    <script>
        const API = 'https://bento-seguridad-prueba-1.onrender.com/api/productos';

        async function listar() {
            const res = await fetch(API);
            const data = await res.json();
            const div = document.getElementById('lista');
            div.innerHTML = '';
            data.forEach(p => {
                div.innerHTML += `
                    <div class="item">
                        <div><b>${p.nombre}</b><br><small>${p.categoria}</small></div>
                        <button class="btn-del" onclick="borrar('${p._id}')">ELIMINAR</button>
                    </div>`;
            });
        }

        async function subir() {
            const datos = {
                password: document.getElementById('password').value,
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                categoria: document.getElementById('categoria').value,
                etiqueta: document.getElementById('etiqueta').value,
                imagen: document.getElementById('imagen').value
            };

            const res = await fetch(API, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(datos)
            });

            if(res.ok) { alert('Cargado'); location.reload(); }
            else { alert('Error: Clave incorrecta o datos incompletos'); }
        }

        async function borrar(id) {
            if(!confirm('¿Borrar producto?')) return;
            const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
            if(res.ok) { alert('Eliminado'); listar(); }
        }

        listar();
    </script>
</body>
</html>
