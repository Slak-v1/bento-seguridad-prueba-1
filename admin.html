<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENTO | Admin Panel</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; }
        .box { background: #111; padding: 25px; border: 1px solid #222; border-radius: 12px; margin-bottom: 50px; transition: 0.3s; }
        h2 { border-bottom: 2px solid #ff6600; padding-bottom: 10px; text-transform: uppercase; font-size: 1.2rem; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: white; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 14px; background: #ff6600; border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 6px; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #ff8800; }
        
        .btn-edit { background: #444; color: white; width: auto; padding: 8px 15px; font-size: 0.7rem; margin-right: 5px; }
        .btn-del { background: #aa0000; color: white; width: auto; padding: 8px 15px; font-size: 0.7rem; }
        
        .item { display: flex; justify-content: space-between; align-items: center; background: #111; padding: 15px; margin-top: 10px; border-radius: 8px; border: 1px solid #222; }
        .info b { display: block; font-size: 0.9rem; }
        .info small { color: #ff6600; font-size: 0.7rem; text-transform: uppercase; }

        
        .editando { border: 1px solid #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
        #btn-cancel { background: #333; color: white; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="box" id="formulario">
            <h2 id="form-title">Cargar Producto</h2>
            <input type="hidden" id="edit-id"> <input type="text" id="nombre" placeholder="Nombre del producto">
            <textarea id="descripcion" rows="3" placeholder="Descripción técnica"></textarea>
            
            <select id="categoria">
                <option value="camaras">Cámaras</option>
                <option value="alarmas">Alarmas</option>
                <option value="grabacion">DVR/NVR</option>
                <option value="Accesorios">Accesorios</option>
                <option value="controlesdeacceso">Control de Acceso</option>
            </select>
            
            <input type="text" id="etiqueta" placeholder="Etiqueta (Ej: Full HD)">
            <input type="text" id="imagen" placeholder="Imagen (ej: domo.jpg)">
            <input type="password" id="password" placeholder="Contraseña Maestra">
            
            <button onclick="enviar()" id="btn-main">Publicar Ahora</button>
            <button onclick="resetForm()" id="btn-cancel">Cancelar Edición</button>
        </div>

        <h2>Catálogo Activo</h2>
        <div id="lista">Cargando...</div>
    </div>

    <script>
        const API = 'https://bento-seguridad-prueba-1.onrender.com/api/productos';
        let todosLosProductos = [];

    
        async function listar() {
            try {
                const res = await fetch(API);
                todosLosProductos = await res.json();
                const div = document.getElementById('lista');
                div.innerHTML = '';
                todosLosProductos.forEach(p => {
                    div.innerHTML += `
                        <div class="item">
                            <div class="info">
                                <b>${p.nombre}</b>
                                <small>${p.categoria}</small>
                            </div>
                            <div>
                                <button class="btn-edit" onclick="cargarParaEditar('${p._id}')">EDITAR</button>
                                <button class="btn-del" onclick="eliminar('${p._id}')">BORRAR</button>
                            </div>
                        </div>`;
                });
            } catch (e) { console.error("Error al listar"); }
        }


        async function enviar() {
            const id = document.getElementById('edit-id').value;
            const payload = {
                password: document.getElementById('password').value,
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                categoria: document.getElementById('categoria').value,
                etiqueta: document.getElementById('etiqueta').value,
                imagen: document.getElementById('imagen').value
            };

            if(!payload.password) return alert("Poné la clave bento2026");

            const url = id ? `${API}/${id}` : API;
            const metodo = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if(res.ok) {
                    alert(id ? 'Actualizado correctamente' : 'Producto subido');
                    resetForm();
                    listar();
                } else {
                    alert('Error: Clave incorrecta');
                }
            } catch (e) { alert('Error de conexión'); }
        }

      
        function cargarParaEditar(id) {
            const p = todosLosProductos.find(prod => prod._id === id);
            document.getElementById('edit-id').value = p._id;
            document.getElementById('nombre').value = p.nombre;
            document.getElementById('descripcion').value = p.descripcion;
            document.getElementById('categoria').value = p.categoria;
            document.getElementById('etiqueta').value = p.etiqueta;
            document.getElementById('imagen').value = p.imagen;

          
            document.getElementById('form-title').innerText = "Editando: " + p.nombre;
            document.getElementById('btn-main').innerText = "Guardar Cambios";
            document.getElementById('btn-main').style.background = "#00ff88";
            document.getElementById('btn-cancel').style.display = "block";
            document.getElementById('formulario').classList.add('editando');
            window.scrollTo(0,0);
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('nombre').value = '';
            document.getElementById('descripcion').value = '';
            document.getElementById('etiqueta').value = '';
            document.getElementById('imagen').value = '';
            document.getElementById('password').value = '';
            document.getElementById('form-title').innerText = "Cargar Producto";
            document.getElementById('btn-main').innerText = "Publicar Ahora";
            document.getElementById('btn-main').style.background = "#ff6600";
            document.getElementById('btn-cancel').style.display = "none";
            document.getElementById('formulario').classList.remove('editando');
        }

      
        async function eliminar(id) {
            if(!confirm('¿Seguro querés borrarlo?')) return;
            const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
            if(res.ok) listar();
        }

        listar();
    </script>
</body>
</html>
